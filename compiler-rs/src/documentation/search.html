<style>[hidden]{display:none!important}nav ul{columns:2;padding-left:1.25rem}#search-controls{margin:2rem 0}label{display:block;font-weight:600}input{box-sizing:border-box;width:100%;padding:.65rem;font:inherit;border:1px solid #668773;border-radius:.4rem}.module-path{margin-top:3rem}section h3{font-size:1.3rem}a{color:#175f3b}a:focus-visible,input:focus-visible{outline:3px solid #ba7a12;outline-offset:3px}@media(max-width:600px){nav ul{columns:1}}</style>
<script>
(() => {
  const input = document.getElementById('doc-search');
  const status = document.getElementById('search-status');
  const modules = Array.from(document.querySelectorAll('article.module'), element => ({
    element,
    name: element.querySelector('.module-path').textContent.toLocaleLowerCase(),
    declarations: Array.from(element.querySelectorAll('section'), section => ({
      element: section, text: section.textContent.toLocaleLowerCase()
    }))
  }));
  function filter() {
    const query = input.value.trim().toLocaleLowerCase();
    let files = 0, declarations = 0;
    for (const module of modules) {
      const named = module.name.includes(query);
      let matches = 0;
      for (const item of module.declarations) {
        item.element.hidden = !(named || item.text.includes(query));
        if (!item.element.hidden) matches++;
      }
      module.element.hidden = !(named || matches > 0);
      if (!module.element.hidden) files++;
      declarations += matches;
    }
    status.textContent = `${files} module${files === 1 ? '' : 's'}, ${declarations} declaration${declarations === 1 ? '' : 's'} shown`;
  }
  input.addEventListener('input', filter);
  document.querySelector('nav').addEventListener('click', event => {
    if (event.target.closest('a')) { input.value = ''; filter(); }
  });
  document.getElementById('search-controls').hidden = false;
  filter();
})();
</script>
